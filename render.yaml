# Render Blueprint — DEVELOPMENT server (branch: render)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Branch strategy:
#   master / main  → production (Docker / AWS via compose.yml)
#   render         → this blueprint (Render free-tier / staging)
#
# Before first deploy:
#   1. Point the Render Blueprint at the `render` git branch
#   2. Create a Neon (or Render) Postgres DB and set DATABASE_URL (?sslmode=require)
#   3. pnpm db:migrate:deploy && pnpm db:bootstrap (from a machine with DATABASE_URL)
#   4. Set sync:false env vars in the dashboard, then redeploy with public *.onrender.com URLs
#
# Health: GET /health?live=1 (liveness) · GET /health (DB + storage readiness)

services:
  - type: web
    name: booking-inventory-ws
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate
    startCommand: pnpm --filter ws-server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: debug
      - key: DATABASE_URL
        sync: false
      - key: WS_INTERNAL_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: booking-inventory-admin
