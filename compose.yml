# Booking_Inventory — production compose (EOI_CP-style)
#   cp .env.example .env && docker compose up --build -d
#
# Domain: goyalhariyana.com
# Redis: set REDIS_URL in `.env` (external). No redis service in this compose.
#
# Internal Docker network:
#   WS_EMIT_URL → http://ws:3002
#
# Host publish map (VM → container):
#   3100 → sales:3000
#   3101 → admin:3000
#   3102 → ws:3002
#   3103 → customer:3000
#   3104 → reception:3000

services:
  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws
    restart: unless-stopped
    ports:
      - "${WS_HOST_PORT:-3102}:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      WS_PORT: "3002"
      NODE_EXTRA_CA_CERTS: /ap-south-1-bundle.pem
      CORS_ORIGINS: ${CORS_ORIGINS}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health?live=1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  sales:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: sales
    restart: unless-stopped
    ports:
      - "${SALES_HOST_PORT:-3100}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: sales
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${SALES_URL}
      WS_EMIT_URL: http://ws:3002
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_EXTRA_CA_CERTS: /ap-south-1-bundle.pem
      CUSTOMER_URL: ${CUSTOMER_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      ws:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: admin
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-3101}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: admin
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${ADMIN_URL}
      WS_EMIT_URL: http://ws:3002
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_EXTRA_CA_CERTS: /ap-south-1-bundle.pem
      SKIP_DB_MIGRATE: "1"
      SKIP_ADMIN_BOOTSTRAP: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      sales:
        condition: service_healthy
      ws:
        condition: service_healthy

  customer:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: customer
    restart: unless-stopped
    ports:
      - "${CUSTOMER_HOST_PORT:-3103}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: customer
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${CUSTOMER_URL}
      CUSTOMER_URL: ${CUSTOMER_URL}
      NODE_EXTRA_CA_CERTS: /ap-south-1-bundle.pem
      SKIP_DB_MIGRATE: "1"
      SKIP_ADMIN_BOOTSTRAP: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      sales:
        condition: service_healthy

  reception:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: reception
    restart: unless-stopped
    ports:
      - "${RECEPTION_HOST_PORT:-3104}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: reception
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${RECEPTION_URL}
      NODE_EXTRA_CA_CERTS: /ap-south-1-bundle.pem
      SKIP_DB_MIGRATE: "1"
      SKIP_ADMIN_BOOTSTRAP: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      sales:
        condition: service_healthy
