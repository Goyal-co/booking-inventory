# Booking_Inventory — single compose for AWS / VM.
# Copy `.env.example` → `.env`, fill secrets, then:
#   docker compose up --build -d
#
# Apps listen on :3000 inside the container (ws on :3002).
# Storage: real AWS S3 (set S3_* in `.env`). No MinIO.

services:
  sales:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: sales
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: sales
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${SALES_URL:-http://localhost:3000}
      WS_EMIT_URL: ${WS_EMIT_URL:-http://ws:3002}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      ws:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: admin
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${ADMIN_URL:-http://localhost:3001}
      WS_EMIT_URL: ${WS_EMIT_URL:-http://ws:3002}
      SKIP_DB_MIGRATE: "1"
      SKIP_ADMIN_BOOTSTRAP: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      sales:
        condition: service_healthy
      ws:
        condition: service_healthy

  customer:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: customer
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: customer
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${CUSTOMER_URL:-http://localhost:3003}
      SKIP_DB_MIGRATE: "1"
      SKIP_ADMIN_BOOTSTRAP: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      sales:
        condition: service_healthy

  reception:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP: reception
    restart: unless-stopped
    ports:
      - "3004:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP: reception
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${RECEPTION_URL:-http://localhost:3004}
      SKIP_DB_MIGRATE: "1"
      SKIP_ADMIN_BOOTSTRAP: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      sales:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      WS_PORT: "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
